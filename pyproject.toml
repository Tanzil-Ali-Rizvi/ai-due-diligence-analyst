[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-due-diligence-analyst"
version = "0.1.0"
description = "Multi-agent (LangGraph) investment due-diligence analyst with tool-computed metrics, a fact-checking critic, human approval and CI-gated evals."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tanzil Ali Rizvi" }]
dependencies = [
  "langgraph>=1.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "rank-bm25>=0.2.2",
  "httpx>=0.27",
]

[project.optional-dependencies]
ui = ["streamlit>=1.35"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
ddagent = "ddagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
