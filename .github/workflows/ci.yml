name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint, tests and offline eval gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests (graph, critic, human-in-the-loop, scripted-LLM paths)
        run: pytest -q
      - name: Evaluation quality gate (offline, deterministic)
        run: python -m ddagent.evaluation --gate --out eval-offline
      - name: Publish report
        if: always()
        run: cat eval-offline/report.md >> "$GITHUB_STEP_SUMMARY"

  eval-llm:
    name: Evaluation with a real LLM (Groq)
    runs-on: ubuntu-latest
    needs: test
    # LLM output varies and free tiers rate-limit, so this job reports but never blocks the build.
    continue-on-error: true
    env:
      DD_LLM_PROVIDER: openai
      DD_LLM_API_KEY: ${{ secrets.DD_LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Run LLM evaluation
        if: env.DD_LLM_API_KEY != ''
        run: python -m ddagent.evaluation --gate --out eval-llm
      - name: Publish report
        if: always() && env.DD_LLM_API_KEY != ''
        run: cat eval-llm/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Skip notice
        if: env.DD_LLM_API_KEY == ''
        run: echo "Add a DD_LLM_API_KEY repository secret to run the LLM evaluation." >> "$GITHUB_STEP_SUMMARY"

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
